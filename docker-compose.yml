x-api-common: &api-common
  build: .
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - .:/app
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0",
            "--port", "8000", "--no-access-log"]

services:
  api1:
    <<: *api-common
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-1

  api2:
    <<: *api-common
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-2

  api3:
    <<: *api-common
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  redis-data:
