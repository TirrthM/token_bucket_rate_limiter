services:
  api:
    build: .                      # build from our Dockerfile
    ports:
      - "8000:8000"               # your Windows port 8000 -> container port 8000
    environment:
      - REDIS_URL=redis://redis:6379/0   # "redis" = the container name below
    depends_on:
      - redis                     # start Redis before the api

  redis:
    image: redis:7-alpine         # official tiny Redis image — no install needed
    command: ["redis-server", "--appendonly", "yes"]   # WRITE DATA TO DISK (Req #3!)
    volumes:
      - redis-data:/data          # keep that disk data in a named volume

volumes:
  redis-data:                     # survives container restarts & rebuilds