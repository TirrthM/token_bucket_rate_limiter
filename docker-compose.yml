services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app                    # your live folder replaces the baked-in copy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0",
              "--port", "8000", "--reload"]   # auto-restart on code change

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data: